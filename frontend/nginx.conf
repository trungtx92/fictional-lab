server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed JS/CSS assets: cache aggressively, they're content-addressed.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any unknown path serves index.html so React Router
    # can handle client-side routes like /transactions/42.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
