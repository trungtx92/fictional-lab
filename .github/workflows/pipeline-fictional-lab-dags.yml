name: Pipeline Fictional Lab DAGs Deployment
on:
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy DAGs
    runs-on: ubuntu-latest
    environment: development
    env:
      COMPOSER_ENVIRONMENT: fictional-lab-airflow
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
    steps:
      - name: Check Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GH_GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate DAG syntax
        run: python3 -m compileall -q Pipeline/FictionalLab/DAGs

      - name: Get DAG bucket
        id: composer
        run: |
          DAG_PREFIX=$(gcloud composer environments describe "$COMPOSER_ENVIRONMENT" \
            --project "$GCP_PROJECT_ID" \
            --location "$GCP_REGION" \
            --format="value(config.dagGcsPrefix)")
          echo "dag_prefix=$DAG_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Deploy DAGs
        run: |
          gcloud storage rsync Pipeline/FictionalLab/DAGs "${{ steps.composer.outputs.dag_prefix }}" \
            --recursive \
            --exclude=".*__pycache__.*"
