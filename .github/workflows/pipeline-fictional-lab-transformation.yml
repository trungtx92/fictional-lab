name: Pipeline Fictional Lab Transformation Pipeline
on:
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy Transformation Pipeline
    runs-on: ubuntu-latest
    environment: development
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
    steps:
      - name: Check Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GH_GCP_SA_KEY }}
      
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run Job
        run: |
          gcloud run job deploy fictional-lab-transformation-pipeline \
            --source Pipeline/FictionalLab/DataTransformation \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --service-account "fictional-lab-service-account@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --max-retries 0