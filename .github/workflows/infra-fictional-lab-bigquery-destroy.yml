name: Infrastructure Fictional Lab BigQuery Destroy
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm deleting the BigQuery resources'
        required: true
        type: string
defaults:
  run:
    working-directory: Infrastructure/FictionalLab/Bigquery
jobs:
  plan-destroy:
    name: Terraform Plan Destroy
    if: ${{ inputs.confirm == 'destroy' }}
    runs-on: ubuntu-latest
    environment: development
    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ secrets.GCP_REGION }}
      TF_VAR_zone: ${{ secrets.GCP_ZONE }}
    steps:
      - name: Check Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GH_GCP_SA_KEY }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan Destroy
        run: terraform plan -destroy -input=false -out=tfplan-destroy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-destroy
          path: Infrastructure/FictionalLab/Bigquery/tfplan-destroy
  destroy:
    name: Terraform Destroy
    needs: plan-destroy
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GH_GCP_SA_KEY }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-destroy
          path: Infrastructure/FictionalLab/Bigquery

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Destroy
        run: terraform apply -input=false tfplan-destroy
